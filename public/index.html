<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Finanças — Acesso</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4ade80">
</head>
<body>

  <div id="toast-container"></div>

  <div class="cartao-acesso">
    <div class="logo-area">
      <svg class="logo-icon" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" aria-label="Finanças">
        <polygon points="200,28 348,114 348,286 200,372 52,286 52,114" fill="#13161b" stroke="#2a2f38" stroke-width="2"/>
        <polygon points="200,50 328,122 328,278 200,350 72,278 72,122" fill="none" stroke="#4ade80" stroke-width="0.8" stroke-opacity="0.15"/>
        <rect x="118" y="208" width="22" height="48" rx="4" fill="#4ade80" opacity="0.25"/>
        <rect x="152" y="178" width="22" height="78" rx="4" fill="#4ade80" opacity="0.35"/>
        <rect x="186" y="148" width="22" height="108" rx="4" fill="#4ade80" opacity="0.5"/>
        <rect x="220" y="118" width="22" height="138" rx="4" fill="#4ade80"/>
        <rect x="254" y="148" width="22" height="108" rx="4" fill="#4ade80" opacity="0.5"/>
        <polyline points="129,202 163,172 197,142 231,112 265,142" fill="none" stroke="#4ade80" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
        <circle cx="231" cy="112" r="5" fill="#4ade80"/>
        <line x1="112" y1="256" x2="288" y2="256" stroke="#2a2f38" stroke-width="1.5" stroke-linecap="round"/>
        <text x="200" y="308" text-anchor="middle" font-family="system-ui,sans-serif" font-size="28" font-weight="600" letter-spacing="3" fill="#f0f2f5">FINANÇAS</text>
        <text x="200" y="334" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" letter-spacing="2" fill="#4ade80" opacity="0.75">GERENCIE COM CLAREZA</text>
      </svg>
      <h2 id="titulo-form">Acessar conta</h2>
      <p class="subtitulo-form">Gerencie suas finanças com clareza</p>
      <p class="versao-app" data-version="1.0.11">v1.0.11</p>
    </div>

    <form id="formulario-auth">
      <div class="grupo-campo">
        <label for="email">E-mail</label>
        <input type="email" id="email" required placeholder="seu@email.com" autocomplete="email">
      </div>
      <div class="grupo-campo">
        <label for="senha">Senha</label>
        <input type="password" id="senha" required placeholder="••••••••" autocomplete="current-password">
      </div>
      <button type="submit" id="botao-submit">Entrar</button>
    </form>

    <div class="alternar-modo">
      <span id="texto-alternar">Novo por aqui? </span>
      <a id="link-alternar">Crie uma conta</a>
    </div>
    
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
