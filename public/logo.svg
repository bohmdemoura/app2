<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Finanças — Logotipo</title>
  <desc>Logotipo do aplicativo Finanças: um hexágono escuro com um símbolo de cifra verde e o nome do app</desc>

  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#16191f"/>
      <stop offset="100%" stop-color="#0d0f12"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <filter id="glow-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Hexagon background -->
  <polygon
    points="200,28 348,114 348,286 200,372 52,286 52,114"
    fill="url(#bg-grad)"
    stroke="#2a2f38"
    stroke-width="2"
  />

  <!-- Inner ring (subtle) -->
  <polygon
    points="200,50 328,122 328,278 200,350 72,278 72,122"
    fill="none"
    stroke="#4ade80"
    stroke-width="0.8"
    stroke-opacity="0.12"
  />

  <!-- Chart bars (stylized) -->
  <rect x="118" y="208" width="22" height="48" rx="4" fill="#4ade80" opacity="0.25"/>
  <rect x="152" y="178" width="22" height="78" rx="4" fill="#4ade80" opacity="0.35"/>
  <rect x="186" y="148" width="22" height="108" rx="4" fill="#4ade80" opacity="0.5"/>
  <rect x="220" y="118" width="22" height="138" rx="4" fill="url(#accent-grad)" opacity="0.9" filter="url(#glow-soft)"/>
  <rect x="254" y="148" width="22" height="108" rx="4" fill="#4ade80" opacity="0.5"/>

  <!-- Trend line over bars -->
  <polyline
    points="129,202 163,172 197,142 231,112 265,142"
    fill="none"
    stroke="#4ade80"
    stroke-width="2.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    opacity="0.7"
  />
  <!-- Dot on peak -->
  <circle cx="231" cy="112" r="5" fill="#4ade80" filter="url(#glow-soft)"/>

  <!-- Baseline -->
  <line x1="112" y1="256" x2="288" y2="256" stroke="#2a2f38" stroke-width="1.5" stroke-linecap="round"/>

  <!-- App name -->
  <text
    x="200" y="308"
    text-anchor="middle"
    font-family="'SF Pro Display', 'Segoe UI', sans-serif"
    font-size="28"
    font-weight="600"
    letter-spacing="3"
    fill="#f0f2f5"
  >FINANÇAS</text>

  <!-- Tagline -->
  <text
    x="200" y="334"
    text-anchor="middle"
    font-family="'SF Pro Text', 'Segoe UI', sans-serif"
    font-size="11"
    font-weight="400"
    letter-spacing="2"
    fill="#4ade80"
    opacity="0.75"
  >GERENCIE COM CLAREZA</text>
</svg>