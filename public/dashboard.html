<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel - Finanças</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="cartao-painel">
        <header class="cabecalho-painel">
            <h2>Inserção de Valores</h2>
            <button id="botao-sair" class="botao-secundario">Sair</button>
        </header>
        <div class="painel-total">
            <span>Saldo Total</span>
            <h2 id="valor-total">R$ 0.00</h2>
        </div>

        <form id="formulario-transacao">
            <div class="grupo-campo">
                <label for="descricao">Descrição da Compra</label>
                <input type="text" id="descricao" required placeholder="Ex: Supermercado">
            </div>

            <div class="grupo-campo">
                <label for="valor">Valor (R$)</label>
                <input type="number" id="valor" step="0.01" required placeholder="0.00">
            </div>

            <div class="grupo-campo">
                <label for="tipo-pagamento">Forma de Pagamento</label>
                <select id="tipo-pagamento" required>
                    <option value="">Selecione...</option>
                    <option value="debito">Débito</option>
                    <option value="credito">Crédito</option>
                </select>
            </div>

            <div class="grupo-campo" id="area-parcelas" style="display: none;">
                <label for="parcelas">Número de Parcelas</label>
                <input type="number" id="parcelas" min="1" value="1">
            </div>

            <button type="submit" id="botao-adicionar">Adicionar Transação</button>
        </form>

        <hr style="margin: 30px 0; border: 0; border-top: 1px solid #eee;">
        
        <div class="historico-transacoes">
            <h3>Histórico de financias</h3>
            <div id="lista-transacoes">
                <p style="color: #888; text-align: center;">Carregando transações...</p>
            </div>
        </div>
    </div>

    <script type="module" src="dashboard.js"></script>
</body>
</html>
