<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finanças — Painel</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="pagina-dashboard">

    <div class="cartao-painel">

        <header class="cabecalho-painel">
            <div class="titulo-app">
                <span class="dot"></span>
                <h2>Finanças</h2>
            </div>
            <button id="botao-sair" class="botao-sair">Sair</button>
        </header>

        <div class="painel-total">
            <div class="label-saldo">Saldo total</div>
            <h2 id="valor-total">R$ 0,00</h2>
        </div>

        <div class="secao-formulario">
            <p class="titulo-secao">Nova transação</p>

            <form id="formulario-transacao">
                <div class="grupo-campo">
                    <label for="descricao">Descrição</label>
                    <input type="text" id="descricao" required placeholder="Ex: Supermercado">
                </div>

                <div class="grupo-campo">
                    <label for="valor">Valor (R$)</label>
                    <input type="number" id="valor" step="0.01" required placeholder="0,00">
                </div>

                <div class="grupo-campo">
                    <label for="tipo-pagamento">Pagamento</label>
                    <select id="tipo-pagamento" required>
                        <option value="">Selecione...</option>
                        <option value="debito">Débito</option>
                        <option value="credito">Crédito</option>
                    </select>
                </div>

                <div class="grupo-campo" id="area-parcelas" style="display: none;">
                    <label for="parcelas">Parcelas</label>
                    <input type="number" id="parcelas" min="1" value="1">
                </div>

                <button type="submit" id="botao-adicionar">+ Adicionar transação</button>
            </form>
        </div>

        <div class="historico-transacoes">
            <p class="titulo-secao">Histórico</p>
            <div id="lista-transacoes">
                <p class="estado-vazio">Carregando transações...</p>
            </div>
        </div>

    </div>

    <script type="module" src="dashboard.js"></script>
</body>
</html>
